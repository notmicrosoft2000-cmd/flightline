    .tiny { font-size: 15px; letter-spacing: 1.2px; }
    .small { font-size: 18px; letter-spacing: .6px; }
    .mid { font-size: 24px; }
    .big { font-size: 30px; }
    .paper { fill: #fcf5f1; }
    .paper2 { fill: #ede5e2; }
    .paper3 { fill: #d0c5c0; }
