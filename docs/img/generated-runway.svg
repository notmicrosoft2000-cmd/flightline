<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Generated runway and Minecraft terrain diagram</title>
  <desc id="desc">A blocky surveyed Overworld site with a 400 by 28 block runway, airport markers and a navigation database snapshot panel.</desc>
  <style>
