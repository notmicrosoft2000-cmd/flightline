<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Cockpit voice set diagram</title>
  <desc id="desc">A blocky audio rack diagram showing separate Kasa and Gina voice sets routed to engine loops, GPWS, TCAS and radio callouts.</desc>
  <style>
    text { font-family: "Courier New", monospace; font-weight: 700; }
    .tiny { font-size: 14px; letter-spacing: .8px; }
    .small { font-size: 17px; letter-spacing: .4px; }
    .mid { font-size: 22px; }
    .paper { fill: #fcf5f1; }
    .paper3 { fill: #d0c5c0; }
    .ink { fill: #171615; }
    .coal { fill: #262423; }
    .stone { fill: #3d3938; }
    .green { fill: #6cc349; }
    .amber { fill: #ffc42b; }
    .red { fill: #b83b2e; }
    .cyan { fill: #36e6ff; }
    .blue { fill: #1e6eea; }
  </style>

  <rect width="1200" height="360" fill="#171615"/>
  <rect x="0" y="0" width="1200" height="50" fill="#36e6ff"/>
  <rect x="0" y="46" width="1200" height="4" fill="#000000"/>
  <text x="22" y="33" class="tiny" fill="#171615">DIAGRAM 08 / COCKPIT VOICE ROUTING</text>
  <text x="1178" y="33" text-anchor="end" class="tiny" fill="#171615">TWO SEPARATE SETS · NO MIXED CALLOUTS</text>

  <!-- Source tabs -->
  <rect x="32" y="80" width="204" height="68" fill="#000000"/>
  <rect x="24" y="72" width="204" height="68" fill="#1e6eea"/>
  <text x="126" y="100" text-anchor="middle" class="tiny" fill="#d0c5c0">VOICE SET A</text>
  <text x="126" y="128" text-anchor="middle" class="mid" fill="#fcf5f1">KASA A380</text>

  <rect x="32" y="172" width="204" height="68" fill="#000000"/>
  <rect x="24" y="164" width="204" height="68" fill="#66412c"/>
  <text x="126" y="192" text-anchor="middle" class="tiny" fill="#ffc42b">VOICE SET B</text>
  <text x="126" y="220" text-anchor="middle" class="mid" fill="#fcf5f1">GINA 787</text>

  <rect x="32" y="264" width="204" height="62" fill="#171615" stroke="#000000" stroke-width="4"/>
  <text x="126" y="288" text-anchor="middle" class="tiny" fill="#6cc349">PLAYER SELECTS</text>
  <text x="126" y="312" text-anchor="middle" class="tiny" fill="#fcf5f1">ONE AIRFRAME</text>

  <!-- Routing bus -->
  <rect x="270" y="128" width="26" height="146" fill="#ffc42b" stroke="#000000" stroke-width="4"/>
  <path d="M296 156H346M296 206H346M296 256H346" stroke="#ffc42b" stroke-width="6"/>
  <polygon points="346,146 378,156 346,166" fill="#ffc42b" stroke="#000000" stroke-width="3"/>
  <polygon points="346,196 378,206 346,216" fill="#ffc42b" stroke="#000000" stroke-width="3"/>
  <polygon points="346,246 378,256 346,266" fill="#ffc42b" stroke="#000000" stroke-width="3"/>

  <!-- Output strips -->
  <g class="small">
    <rect x="392" y="80" width="238" height="68" fill="#000000"/>
    <rect x="384" y="72" width="238" height="68" fill="#262423"/>
    <text x="402" y="100" class="tiny" fill="#6cc349">ENGINE</text>
    <text x="402" y="126" fill="#fcf5f1">LOOP / CRUISE</text>

    <rect x="392" y="164" width="238" height="68" fill="#000000"/>
    <rect x="384" y="156" width="238" height="68" fill="#262423"/>
    <text x="402" y="184" class="tiny" fill="#ffc42b">WARNINGS</text>
    <text x="402" y="210" fill="#fcf5f1">GPWS / ALARMS</text>

    <rect x="392" y="248" width="238" height="68" fill="#000000"/>
    <rect x="384" y="240" width="238" height="68" fill="#262423"/>
    <text x="402" y="268" class="tiny" fill="#36e6ff">RADIO</text>
    <text x="402" y="294" fill="#fcf5f1">TCAS / ATC VOICE</text>
  </g>

  <!-- Equalizer and waveform -->
  <rect x="656" y="72" width="520" height="252" fill="#000000"/>
  <rect x="648" y="64" width="520" height="252" fill="#171615"/>
  <rect x="648" y="64" width="520" height="40" fill="#3d3938"/>
  <text x="668" y="90" class="tiny" fill="#fcf5f1">SIGNAL / IN-BROWSER PREVIEW</text>

  <g fill="#6cc349">
    <rect x="672" y="222" width="18" height="58"/>
    <rect x="700" y="184" width="18" height="96"/>
    <rect x="728" y="206" width="18" height="74"/>
    <rect x="756" y="150" width="18" height="130"/>
    <rect x="784" y="196" width="18" height="84"/>
    <rect x="812" y="170" width="18" height="110"/>
    <rect x="840" y="214" width="18" height="66"/>
    <rect x="868" y="186" width="18" height="94"/>
    <rect x="896" y="160" width="18" height="120"/>
    <rect x="924" y="210" width="18" height="70"/>
  </g>
  <g fill="#ffc42b">
    <rect x="952" y="190" width="18" height="90"/>
    <rect x="980" y="226" width="18" height="54"/>
    <rect x="1008" y="176" width="18" height="104"/>
    <rect x="1036" y="202" width="18" height="78"/>
    <rect x="1064" y="222" width="18" height="58"/>
    <rect x="1092" y="188" width="18" height="92"/>
    <rect x="1120" y="208" width="18" height="72"/>
  </g>
  <path d="M668 248H1148" stroke="#171615" stroke-width="4"/>

  <rect x="648" y="280" width="520" height="28" fill="#ffc42b" stroke="#000000" stroke-width="3"/>
  <text x="908" y="300" text-anchor="middle" class="tiny" fill="#171615">PLAY ALL PLAYS THE SELECTED SET IN ORDER</text>
</svg>
