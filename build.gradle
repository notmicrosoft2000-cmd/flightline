plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.version
group = project.group

base {
    archivesName = 'flightline'
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "flightline" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly 'org.jspecify:jspecify:1.0.0'
    clientCompileOnly 'org.jspecify:jspecify:1.0.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testCompileOnly 'org.jspecify:jspecify:1.0.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

def modVersion = project.version

processResources {
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') {
        expand version: modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from('LICENSE') {
        rename { "${it}_flightline" }
    }
}

tasks.register('packageAlphaRelease', Sync) {
    dependsOn tasks.named('jar'), tasks.named('test')
    from(tasks.named('jar'))
    from('pojav/flightline-touch-controls.json')
    into(layout.buildDirectory.dir("distributions/flightline-${project.version}"))
}

tasks.named('build') {
    dependsOn tasks.named('packageAlphaRelease')
}
